plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Unit tests for pure logic (grid math, SNBT round-trips, registry
// allocation) — no game bootstrap involved, so plain JUnit 5.
test {
    useJUnitPlatform()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // ModDevGradle puts Minecraft/NeoForge on main's compileClasspath; the
    // test source set does not inherit it, so tests (which touch BlockPos,
    // ResourceKey, CompoundTag) would not resolve the game types. Copying
    // as files is the Gradle 8+ safe form (a bare Configuration is banned).
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Regenerates data/foldedhorizons/structure/{starter_cell,lobby,meteorite_pocket}.nbt
// in place. The templates live in resources (datapack-overridable); rerun
// this after editing dev.foldedhorizons.core.tools.TemplateGenerator.
tasks.register('generateTemplates', JavaExec) {
    group = 'foldedhorizons'
    description = 'Regenerates the pocket structure templates into src/main/resources.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.foldedhorizons.core.tools.TemplateGenerator'
    args = [file('src/main/resources/data/foldedhorizons/structure').absolutePath]
}
