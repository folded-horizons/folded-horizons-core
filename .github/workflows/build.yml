name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # gradle/wrapper/ has only gradle-wrapper.properties (no wrapper
      # jar), so `gradle wrapper` runs once to materialize the wrapper.
      # Gradle 8.8 matches gradle-wrapper.properties.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile core
        run: ./gradlew :core:compileJava --no-daemon

      - name: 'Test core (JUnit: grid math, registry, SNBT round-trip)'
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Check core (static checks)
        run: ./gradlew :core:check --no-daemon
