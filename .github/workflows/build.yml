name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle/wrapper/ has only gradle-wrapper.properties (no wrapper
      # jar), so `gradle wrapper` runs once to materialize the wrapper.
      # Gradle 8.8 matches gradle-wrapper.properties.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile core
        run: ./gradlew :core:compileJava --no-daemon

      - name: Check core (tests / static checks)
        run: ./gradlew :core:check --no-daemon
