name: Release

# Tag-driven release: push a tag like `v0.1.0` and this builds the core jar
# and attaches it to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# CurseForge publishing is intentionally NOT automated here: it needs a
# project id + API token that the maintainer owns. To add it later, add a
# step using the `ItsDrike/MinecraftCurseForgeUpload` action (or the CF
# Gradle plugin) gated on the same tag, reading a CF_API_TOKEN secret.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle/wrapper/ ships only gradle-wrapper.properties, so materialize
      # the wrapper once (matches the build workflow).
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jars
        run: ./gradlew :core:build --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find core/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: false
